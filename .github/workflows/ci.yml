name: CI/CD Pipeline

on:
  push:
    branches: [ main, Django-React, Django-React-login-register ]
  pull_request:
    branches: [ main, Django-React, Django-React-login-register ]

jobs:
  # ============================================
  # Backend (Django) - Linting, Tests, Security
  # ============================================
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./Proyect_v1/Backend/proyect_web_v1
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort pytest pytest-django pytest-cov

    - name: Lint with flake8 (code style)
      working-directory: ./Proyect_v1/Backend/proyect_web_v1
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      working-directory: ./Proyect_v1/Backend/proyect_web_v1
      run: black --check . || true

    - name: Check import order with isort
      working-directory: ./Proyect_v1/Backend/proyect_web_v1
      run: isort --check-only . || true

    - name: Run Django tests
      working-directory: ./Proyect_v1/Backend/proyect_web_v1
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        DJANGO_SECRET_KEY: test-secret-key
        DEBUG: False
      run: |
        python manage.py test

    - name: Check for Django security issues
      working-directory: ./Proyect_v1/Backend/proyect_web_v1
      run: python manage.py check --deploy

  # ============================================
  # Frontend (React) - Linting, Tests, Build
  # ============================================
  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        cache: 'npm'
        cache-dependency-path: Proyect_v1/frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./Proyect_v1/frontend
      run: npm ci

    - name: Run ESLint
      working-directory: ./Proyect_v1/frontend
      run: npx eslint src --max-warnings=0 || true

    - name: Run Prettier (code formatting)
      working-directory: ./Proyect_v1/frontend
      run: npx prettier --check src || true

    - name: Run tests
      working-directory: ./Proyect_v1/frontend
      run: npm test -- --passWithNoTests --coverage

    - name: Build production bundle
      working-directory: ./Proyect_v1/frontend
      run: npm run build

    - name: Check build size
      working-directory: ./Proyect_v1/frontend
      run: |
        BUILD_SIZE=$(du -sh build/ | awk '{print $1}')
        echo "Frontend build size: $BUILD_SIZE"
        if [ $(du -sb build/ | awk '{print $1}') -gt 5242880 ]; then
          echo " Warning: build size exceeds 5MB"
        fi

  # ============================================
  # Docker - Build images
  # ============================================
  docker:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build backend Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./Proyect_v1/Backend/proyect_web_v1
        push: false
        tags: proyect-web:backend-latest

    - name: Build frontend Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./Proyect_v1/frontend
        push: false
        tags: proyect-web:frontend-latest

  # ============================================
  # Security - Dependency scanning
  # ============================================
  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required for SARIF upload
      contents: read          # Required for repository checkout

    steps:
    - uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner (Docker images)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # ============================================
  # Status Check
  # ============================================
  status:
    runs-on: ubuntu-latest
    needs: [ backend, frontend, docker, security ]
    if: always()

    steps:
    - name: Check if all jobs passed
      run: |
        if [ "${{ needs.backend.result }}" != "success" ] || \
           [ "${{ needs.frontend.result }}" != "success" ] || \
           [ "${{ needs.docker.result }}" != "success" ] || \
           [ "${{ needs.security.result }}" != "success" ]; then
          echo " CI/CD Pipeline failed"
          exit 1
        else
          echo " CI/CD Pipeline passed"
        fi
