version: '3'

services:
  db_postgres:
    container_name: db_postgres_mk
    image: postgis/postgis:15-3.3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mikeadd
    networks:
      - mk-network

  pgadmin:
    container_name: pgadmin_mk
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "ibarramiguel119@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "mkroot"
    ports:
      - '5050:80'
    depends_on:  
      - db_postgres
    networks:
      - mk-network

  web:
    container_name: web_mk
    build: ./Backend/proyect_web_v1
    command: python manage.py runserver 0.0.0.0:80
    expose:
      - 80
    volumes:
      - static:/app/static
      - ./Backend/proyect_web_v1:/app  # Path actualizado del proyecto
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - db_postgres
    environment:
      - GDAL_LIBRARY_PATH=/usr/lib/libgdal.so
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DOMAIN}
    networks:
      - mk-network

  frontend:
    build: ./frontend
    container_name: frontend_mk
    ports:
      - "3000:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html  # Asegúrate de que esta ruta sea la correcta
    networks:
      - mk-network  

  nginx:
    image: nginx:1.13
    container_name: proyect_v1-nginx-1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/build:/usr/share/nginx/html  # Monta el build de React en la misma ruta
    networks:
      - mk-network

  
volumes:
  postgres_data:
  static:
  proxy-dhparams:

networks:
  mk-network:
    driver: bridge